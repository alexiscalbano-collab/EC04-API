security:
    password_hashers:
        App\Entity\Livreur:
            algorithm: auto

    providers:
        livreur_provider:
            entity:
                class: App\Entity\Livreur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # route de login — publique
        login:
            pattern: ^/api/v1/auth/login
            stateless: true
            security: false

        # tout le reste de l'API
        api:
            pattern: ^/api
            stateless: true
            provider: livreur_provider
            jwt: ~

    access_control:
        # routes publiques
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/products, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/livreurs, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        # sac protégé
        - { path: ^/api/v1/sac, roles: ROLE_LIVREUR }
